<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">StateSeal delivery intelligence panorama</title>
  <desc id="desc">A read-only delivery evidence graph connects a request, observed code states, checks, artifacts, and an Agent completion claim, with diagnostic findings and evidence freshness.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0c1425"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#142033"/><stop offset="1" stop-color="#101827"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".32"/></filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#8da2c5" opacity=".12"/></pattern>
    <style>
      .brand{font:700 28px Inter,system-ui,sans-serif;fill:#f4f7fb}.caps{font:700 14px Inter,system-ui,sans-serif;letter-spacing:2px;fill:#8fa0ba}.h1{font:700 34px Inter,system-ui,sans-serif;fill:#f8fafc}.h2{font:700 18px Inter,system-ui,sans-serif;fill:#edf3fb}.body{font:500 15px Inter,system-ui,sans-serif;fill:#9caec6}.small{font:600 13px Inter,system-ui,sans-serif;fill:#8ea0b9}.mono{font:600 13px ui-monospace,SFMono-Regular,monospace;fill:#aebbd0}.good{fill:#43d3a0}.warn{fill:#f6bd4b}.blueText{fill:#72a7ff}.line{stroke:#445873;stroke-width:2;fill:none}.flow{stroke:#58a6ff;stroke-width:3;fill:none}.dash{stroke-dasharray:8 8}.node{fill:url(#card);stroke:#2a3a52;stroke-width:1.5}.panel{fill:#0d1726;stroke:#24334a;stroke-width:1.5}.pill{fill:#15263a}.divider{stroke:#26364d;stroke-width:1}
    </style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <circle cx="1420" cy="85" r="250" fill="#183a72" opacity=".20"/>
  <circle cx="110" cy="860" r="260" fill="#0d5962" opacity=".14"/>
  <g transform="translate(70 56)">
    <path d="M0 18 22 4l22 14v30L22 62 0 48Z" fill="url(#blue)"/><path d="m13 24 9-6 9 6v17l-9 6-9-6Z" fill="#091527"/>
    <text x="60" y="31" class="brand">StateSeal</text><text x="60" y="54" class="caps">DELIVERY INTELLIGENCE · READ ONLY</text>
    <circle cx="1375" cy="26" r="5" fill="#43d3a0"/><text x="1390" y="31" class="small">LIVE</text>
  </g>
  <g transform="translate(70 150)">
    <text class="caps">AGENT DELIVERY PANORAMA</text>
    <text y="52" class="h1">What changed, what supports it, and where evidence breaks.</text>
    <text y="84" class="body">Facts, state-aware checks, artifacts, diagnostics, and audit—without controlling the Agent.</text>
  </g>
  <g transform="translate(70 270)" filter="url(#shadow)">
    <rect width="1460" height="370" rx="22" class="panel"/><rect x="16" y="72" width="1428" height="276" rx="16" fill="url(#grid)"/>
    <text x="28" y="35" class="h2">Delivery evidence graph</text><text x="28" y="58" class="small">Request → code states → checks and artifacts → Agent completion claim</text>
    <g transform="translate(48 145)">
      <path d="M220 74H290M510 74H580M800 74H870M1090 74h70" class="flow"/>
      <path d="M690 120v58h180" class="line dash"/><path d="M980 120v58h180" class="line dash"/>
      <g><rect width="220" height="145" rx="16" class="node"/><rect width="5" height="145" rx="3" fill="#60a5fa"/><circle cx="34" cy="35" r="14" fill="#173457"/><path d="M28 35h12M34 29v12" stroke="#72a7ff" stroke-width="2"/><text x="58" y="31" class="caps blueText">REQUEST</text><text x="24" y="72" class="h2">Delivery goal</text><text x="24" y="99" class="body">Fix callback duplication</text><text x="24" y="124" class="small">Observed</text></g>
      <g transform="translate(290)"><rect width="220" height="145" rx="16" class="node"/><rect width="5" height="145" rx="3" fill="#60a5fa"/><text x="24" y="33" class="caps blueText">CODE STATE S1</text><text x="24" y="72" class="h2">3 files changed</text><text x="24" y="99" class="mono">+42 / −16</text><text x="24" y="124" class="small">Derived from edit events</text></g>
      <g transform="translate(580)"><rect width="220" height="145" rx="16" class="node"/><rect width="5" height="145" rx="3" fill="#43d3a0"/><text x="24" y="33" class="caps good">CHECK · S1</text><text x="24" y="72" class="h2">Test suite passed</text><text x="24" y="99" class="mono">go test ./...</text><text x="24" y="124" class="small">Current by sequence</text></g>
      <g transform="translate(870)"><rect width="220" height="145" rx="16" class="node"/><rect width="5" height="145" rx="3" fill="#f6bd4b"/><text x="24" y="33" class="caps warn">CODE STATE S2</text><text x="24" y="72" class="h2">Later edit observed</text><text x="24" y="99" class="body">Evidence became stale</text><text x="24" y="124" class="small">Derived · inspect basis</text></g>
      <g transform="translate(1160)"><rect width="220" height="145" rx="16" class="node"/><rect width="5" height="145" rx="3" fill="#f6bd4b"/><text x="24" y="33" class="caps warn">AGENT CLAIM</text><text x="24" y="72" class="h2">Reported complete</text><text x="24" y="99" class="body">Not an approval</text><text x="24" y="124" class="small">Observed</text></g>
      <g transform="translate(710 174)"><rect width="160" height="56" rx="12" class="node"/><text x="18" y="24" class="small">report.pdf</text><text x="18" y="43" class="caps">ARTIFACT</text></g>
      <g transform="translate(1000 174)"><rect width="160" height="56" rx="12" class="node"/><text x="18" y="24" class="small">No current check</text><text x="18" y="43" class="caps warn">FINDING</text></g>
    </g>
  </g>
  <g transform="translate(70 674)">
    <g><rect width="455" height="160" rx="18" class="panel"/><text x="24" y="34" class="caps">CURRENT STATE</text><text x="24" y="75" class="h2">a3fe9e0 + dirty</text><text x="24" y="105" class="body">3 changed files · branch main</text><line x1="24" x2="431" y1="125" y2="125" class="divider"/><text x="24" y="148" class="small">Read-only Git metadata</text></g>
    <g transform="translate(478)"><rect width="500" height="160" rx="18" class="panel"/><text x="24" y="34" class="caps warn">DIAGNOSTIC FINDING · DERIVED</text><text x="24" y="75" class="h2">Final observed state has no current check</text><text x="24" y="105" class="body">The workspace changed after the last recognized check.</text><line x1="24" x2="476" y1="125" y2="125" class="divider"/><text x="24" y="148" class="small">Basis: latest change follows every recognized check</text></g>
    <g transform="translate(1001)"><rect width="459" height="160" rx="18" class="panel"/><text x="24" y="34" class="caps">EVIDENCE DISCIPLINE</text><circle cx="32" cy="69" r="5" fill="#43d3a0"/><text x="48" y="74" class="body">Observed facts</text><circle cx="32" cy="101" r="5" fill="#f6bd4b"/><text x="48" y="106" class="body">Reproducible derivations</text><circle cx="32" cy="133" r="5" fill="#818cf8"/><text x="48" y="138" class="body">Explicitly labeled inference</text></g>
  </g>
</svg>
