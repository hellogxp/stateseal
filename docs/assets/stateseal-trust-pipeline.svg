<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">StateSeal trusted delivery pipeline</title>
  <desc id="desc">A coding agent creates an isolated candidate. Independent verifiers bind evidence to the exact state. The broker preserves checkpoints and decides admission. The user explicitly applies an admitted checkpoint.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0d1728"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ea1ff"/>
      <stop offset="1" stop-color="#6f6bff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42d6a4"/>
      <stop offset="1" stop-color="#2ebf83"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#5e8fff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#39cc96"/>
    </marker>
    <style>
      .eyebrow{font:600 18px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:3px;fill:#7f91ad}
      .heading{font:700 38px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f4f7fb}
      .subtitle{font:400 20px Inter,ui-sans-serif,system-ui,sans-serif;fill:#9eabc0}
      .step{font:700 21px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f4f7fb}
      .copy{font:400 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#9aa8be}
      .tag{font:700 13px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1.4px}
      .footer{font:600 17px Inter,ui-sans-serif,system-ui,sans-serif;fill:#c8d2e2}
    </style>
  </defs>

  <rect width="1600" height="760" rx="28" fill="url(#bg)"/>
  <path d="M0 120H1600M0 640H1600" stroke="#17253a"/>
  <circle cx="1440" cy="92" r="250" fill="#275dff" opacity=".06"/>
  <circle cx="170" cy="720" r="220" fill="#37d39c" opacity=".045"/>

  <text x="92" y="72" class="eyebrow">STATESEAL · TRUSTED DELIVERY</text>
  <text x="92" y="118" class="heading">From agent output to state-bound evidence</text>
  <text x="92" y="154" class="subtitle">The agent proposes. Independent authority controls what may be delivered.</text>

  <!-- connectors -->
  <path d="M348 354H424" stroke="#5e8fff" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M708 354H784" stroke="#5e8fff" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M1068 354H1144" stroke="#39cc96" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- card 1 -->
  <g filter="url(#shadow)">
    <rect x="64" y="228" width="284" height="252" rx="22" fill="#101d30" stroke="#263a56"/>
    <rect x="64" y="228" width="6" height="252" rx="3" fill="url(#blue)"/>
    <circle cx="114" cy="282" r="24" fill="#182c48" stroke="#407dd7"/>
    <path d="M104 282h20M114 272v20" stroke="#74aaff" stroke-width="3" stroke-linecap="round"/>
    <text x="150" y="278" class="tag" fill="#74aaff">01 · PROPOSE</text>
    <text x="94" y="332" class="step">Agent candidate</text>
    <text x="94" y="368" class="copy">Work happens in an isolated</text>
    <text x="94" y="393" class="copy">proposal, never directly on</text>
    <text x="94" y="418" class="copy">the user branch.</text>
    <rect x="94" y="444" width="144" height="24" rx="12" fill="#172b47"/>
    <text x="108" y="461" class="tag" fill="#7faeff">EXACT TREE STATE</text>
  </g>

  <!-- card 2 -->
  <g filter="url(#shadow)">
    <rect x="424" y="228" width="284" height="252" rx="22" fill="#101d30" stroke="#263a56"/>
    <rect x="424" y="228" width="6" height="252" rx="3" fill="url(#blue)"/>
    <circle cx="474" cy="282" r="24" fill="#182c48" stroke="#407dd7"/>
    <path d="m463 282 8 8 15-18" fill="none" stroke="#74aaff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="278" class="tag" fill="#74aaff">02 · VERIFY</text>
    <text x="454" y="332" class="step">Bound evidence</text>
    <text x="454" y="368" class="copy">Fresh verifier executions are</text>
    <text x="454" y="393" class="copy">cryptographically bound to</text>
    <text x="454" y="418" class="copy">the candidate they evaluated.</text>
    <rect x="454" y="444" width="156" height="24" rx="12" fill="#172b47"/>
    <text x="468" y="461" class="tag" fill="#7faeff">COVERAGE + ORIGIN</text>
  </g>

  <!-- card 3 -->
  <g filter="url(#shadow)">
    <rect x="784" y="228" width="284" height="252" rx="22" fill="#101d30" stroke="#275745"/>
    <rect x="784" y="228" width="6" height="252" rx="3" fill="url(#green)"/>
    <circle cx="834" cy="282" r="24" fill="#14352f" stroke="#2cae7c"/>
    <path d="M834 266 850 274v12c0 11-7 18-16 23-9-5-16-12-16-23v-12Z" fill="none" stroke="#48d6a4" stroke-width="2.5"/>
    <text x="870" y="278" class="tag" fill="#48d6a4">03 · DECIDE</text>
    <text x="814" y="332" class="step">Broker admission</text>
    <text x="814" y="368" class="copy">Policy selects a verified</text>
    <text x="814" y="393" class="copy">checkpoint, recertifies it,</text>
    <text x="814" y="418" class="copy">and records residual risk.</text>
    <rect x="814" y="444" width="178" height="24" rx="12" fill="#15342e"/>
    <text x="828" y="461" class="tag" fill="#52d8aa">SIGNED RECEIPT</text>
  </g>

  <!-- card 4 -->
  <g filter="url(#shadow)">
    <rect x="1144" y="228" width="392" height="252" rx="22" fill="#101d30" stroke="#275745"/>
    <rect x="1144" y="228" width="6" height="252" rx="3" fill="url(#green)"/>
    <circle cx="1194" cy="282" r="24" fill="#14352f" stroke="#2cae7c"/>
    <path d="m1183 282 8 8 15-18" fill="none" stroke="#48d6a4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1230" y="278" class="tag" fill="#48d6a4">04 · APPLY</text>
    <text x="1174" y="332" class="step">User-controlled delivery</text>
    <text x="1174" y="368" class="copy">Only the admitted checkpoint can</text>
    <text x="1174" y="393" class="copy">be applied. Failed later attempts</text>
    <text x="1174" y="418" class="copy">cannot overwrite trusted state.</text>
    <rect x="1174" y="444" width="176" height="24" rx="12" fill="#15342e"/>
    <text x="1188" y="461" class="tag" fill="#52d8aa">EXPLICIT CONSENT</text>
  </g>

  <!-- evidence plane -->
  <rect x="64" y="542" width="1472" height="74" rx="18" fill="#0b1727" stroke="#243750"/>
  <circle cx="104" cy="579" r="10" fill="#5e8fff"/>
  <text x="130" y="585" class="footer">Append-only event ledger</text>
  <path d="M370 579H426" stroke="#2a3d57"/>
  <circle cx="458" cy="579" r="10" fill="#39cc96"/>
  <text x="484" y="585" class="footer">Recoverable verified checkpoint</text>
  <path d="M848 579H904" stroke="#2a3d57"/>
  <circle cx="936" cy="579" r="10" fill="#f4b942"/>
  <text x="962" y="585" class="footer">Explicit coverage and residual risk</text>

  <text x="64" y="690" class="eyebrow">INVARIANT</text>
  <text x="214" y="690" class="subtitle">Evidence is valid only for the exact state that produced it.</text>
</svg>
