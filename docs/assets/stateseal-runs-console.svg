<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">StateSeal Runs Console</title>
  <desc id="desc">A product illustration of the local StateSeal console with a state provenance graph, trusted event timeline, verifier evidence, and completion receipt.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050c15"/>
      <stop offset="1" stop-color="#0b1422"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a29"/>
      <stop offset="1" stop-color="#0c1522"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ca8ff"/>
      <stop offset="1" stop-color="#6464ff"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#31bd87"/>
    </marker>
    <style>
      .brand{font:700 24px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f3f7fd}
      .micro{font:600 12px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1.6px;fill:#718099}
      .h1{font:700 26px Inter,ui-sans-serif,system-ui,sans-serif;fill:#edf2fa}
      .h2{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#e9eef7}
      .body{font:400 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#78879f}
      .node{font:700 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#e9eef7}
      .node2{font:400 12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#77869d}
      .good{font:700 12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#48d6a4;letter-spacing:.8px}
    </style>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#bg2)"/>
  <path d="M0 84H1600" stroke="#1d2a3b"/>
  <path d="m58 31 20 10v22L58 75 38 63V41Z" fill="url(#brand)"/>
  <path d="m58 42 9 5v10l-9 5-9-5V47Z" fill="#0b1524"/>
  <text x="94" y="53" class="brand">StateSeal</text>
  <text x="94" y="72" class="micro">LOCAL CONTROL PLANE</text>
  <circle cx="1465" cy="52" r="6" fill="#48d6a4"/>
  <text x="1480" y="57" class="body">Live</text>

  <text x="72" y="132" class="micro">RUN · PAYMENT-SERVICE</text>
  <text x="72" y="171" class="h1">Fix duplicate callbacks and preserve compatibility</text>
  <rect x="1306" y="125" width="222" height="52" rx="16" fill="#11332d" stroke="#245d4c"/>
  <text x="1340" y="157" class="good">ADMITTED · ALLOWED</text>

  <!-- provenance -->
  <g filter="url(#shadow2)">
    <rect x="48" y="208" width="1504" height="340" rx="22" fill="url(#panel)" stroke="#223149"/>
  </g>
  <text x="74" y="244" class="h2">State provenance DAG</text>
  <text x="74" y="267" class="body">Bound state, evidence, checkpoint, and admission decision.</text>
  <circle cx="1334" cy="241" r="5" fill="#5d9dff"/><text x="1346" y="246" class="micro">ACTIVE</text>
  <circle cx="1422" cy="241" r="5" fill="#48d6a4"/><text x="1434" y="246" class="micro">PASSED</text>
  <rect x="72" y="288" width="1456" height="230" rx="16" fill="#07111d" stroke="#1a283b"/>
  <g opacity=".22" fill="#69809f">
    <circle cx="108" cy="324" r="1.4"/><circle cx="148" cy="324" r="1.4"/><circle cx="188" cy="324" r="1.4"/><circle cx="228" cy="324" r="1.4"/><circle cx="268" cy="324" r="1.4"/><circle cx="308" cy="324" r="1.4"/><circle cx="348" cy="324" r="1.4"/><circle cx="388" cy="324" r="1.4"/><circle cx="428" cy="324" r="1.4"/><circle cx="468" cy="324" r="1.4"/><circle cx="508" cy="324" r="1.4"/><circle cx="548" cy="324" r="1.4"/><circle cx="588" cy="324" r="1.4"/><circle cx="628" cy="324" r="1.4"/><circle cx="668" cy="324" r="1.4"/><circle cx="708" cy="324" r="1.4"/><circle cx="748" cy="324" r="1.4"/><circle cx="788" cy="324" r="1.4"/><circle cx="828" cy="324" r="1.4"/><circle cx="868" cy="324" r="1.4"/><circle cx="908" cy="324" r="1.4"/><circle cx="948" cy="324" r="1.4"/><circle cx="988" cy="324" r="1.4"/><circle cx="1028" cy="324" r="1.4"/><circle cx="1068" cy="324" r="1.4"/><circle cx="1108" cy="324" r="1.4"/><circle cx="1148" cy="324" r="1.4"/><circle cx="1188" cy="324" r="1.4"/><circle cx="1228" cy="324" r="1.4"/><circle cx="1268" cy="324" r="1.4"/><circle cx="1308" cy="324" r="1.4"/><circle cx="1348" cy="324" r="1.4"/><circle cx="1388" cy="324" r="1.4"/><circle cx="1428" cy="324" r="1.4"/><circle cx="1468" cy="324" r="1.4"/>
  </g>

  <path d="M330 405H382M624 405H676M918 405H970M1212 405H1264" stroke="#31bd87" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="96" y="354" width="234" height="102" rx="15" fill="#111e30" stroke="#2a405e"/>
    <rect x="96" y="354" width="5" height="102" rx="2" fill="#5d9dff"/>
    <circle cx="128" cy="387" r="16" fill="#182d49"/><path d="M121 387h14M128 380v14" stroke="#6aa6ff" stroke-width="2"/>
    <text x="154" y="388" class="node">Task intent</text><text x="120" y="423" class="node2">Fix duplicate callbacks…</text>
  </g>
  <g>
    <rect x="390" y="354" width="234" height="102" rx="15" fill="#111e30" stroke="#27503f"/>
    <rect x="390" y="354" width="5" height="102" rx="2" fill="#48d6a4"/>
    <circle cx="422" cy="387" r="16" fill="#14352f"/><path d="m415 387 5 5 9-12" fill="none" stroke="#48d6a4" stroke-width="2"/>
    <text x="448" y="388" class="node">Candidate</text><text x="414" y="423" class="node2">cand_3c0…c2cc</text>
  </g>
  <g>
    <rect x="684" y="354" width="234" height="102" rx="15" fill="#111e30" stroke="#27503f"/>
    <rect x="684" y="354" width="5" height="102" rx="2" fill="#48d6a4"/>
    <circle cx="716" cy="387" r="16" fill="#14352f"/><path d="m709 387 5 5 9-12" fill="none" stroke="#48d6a4" stroke-width="2"/>
    <text x="742" y="388" class="node">Verifier evidence</text><text x="708" y="423" class="node2">cli · PASSED · 19ms</text>
  </g>
  <g>
    <rect x="978" y="354" width="234" height="102" rx="15" fill="#111e30" stroke="#27503f"/>
    <rect x="978" y="354" width="5" height="102" rx="2" fill="#48d6a4"/>
    <circle cx="1010" cy="387" r="16" fill="#14352f"/><path d="M1010 376 1020 381v8c0 7-5 12-10 15-6-3-10-8-10-15v-8Z" fill="none" stroke="#48d6a4" stroke-width="1.8"/>
    <text x="1036" y="388" class="node">Verified checkpoint</text><text x="1002" y="423" class="node2">cp_6951a…f7a9</text>
  </g>
  <g>
    <rect x="1272" y="354" width="230" height="102" rx="15" fill="#111e30" stroke="#27503f"/>
    <rect x="1272" y="354" width="5" height="102" rx="2" fill="#48d6a4"/>
    <circle cx="1304" cy="387" r="16" fill="#14352f"/><path d="m1297 387 5 5 9-12" fill="none" stroke="#48d6a4" stroke-width="2"/>
    <text x="1330" y="388" class="node">ADMITTED</text><text x="1296" y="423" class="node2">ALLOWED</text>
  </g>

  <!-- lower cards -->
  <g filter="url(#shadow2)">
    <rect x="48" y="578" width="904" height="274" rx="22" fill="url(#panel)" stroke="#223149"/>
    <rect x="976" y="578" width="576" height="126" rx="22" fill="url(#panel)" stroke="#223149"/>
    <rect x="976" y="726" width="576" height="126" rx="22" fill="url(#panel)" stroke="#223149"/>
  </g>
  <text x="74" y="616" class="h2">Trusted event timeline</text>
  <text x="74" y="639" class="body">Append-only ledger with verified hash continuity.</text>
  <path d="M110 680V810" stroke="#263a54" stroke-width="2"/>
  <circle cx="110" cy="688" r="6" fill="#5d9dff"/><text x="138" y="693" class="node">TASK CREATED</text><text x="348" y="693" class="node2">17:03:59</text>
  <circle cx="110" cy="728" r="6" fill="#5d9dff"/><text x="138" y="733" class="node">CANDIDATE SUBMITTED</text><text x="348" y="733" class="node2">tree sha256 · 0fc36b…</text>
  <circle cx="110" cy="768" r="6" fill="#48d6a4"/><text x="138" y="773" class="node">CHECKPOINT VERIFIED</text><text x="348" y="773" class="node2">cp_6951a…f7a9</text>
  <circle cx="110" cy="808" r="6" fill="#48d6a4"/><text x="138" y="813" class="node">COMPLETION ADMITTED</text><text x="348" y="813" class="node2">receipt · e84b14…</text>

  <text x="1002" y="616" class="h2">Verifier evidence</text>
  <text x="1002" y="639" class="body">Fresh execution bound to exact code state.</text>
  <rect x="1002" y="658" width="524" height="28" rx="9" fill="#101d2d" stroke="#24364e"/>
  <text x="1018" y="677" class="node">cli</text><text x="1090" y="677" class="node2">Verification · 19ms</text><text x="1452" y="677" class="good">PASSED</text>

  <text x="1002" y="764" class="h2">Completion receipt</text>
  <text x="1002" y="787" class="body">Cryptographic decision artifact.</text>
  <text x="1002" y="821" class="micro">VERDICT</text><text x="1088" y="821" class="good">ADMITTED</text>
  <text x="1260" y="821" class="micro">DISPOSITION</text><text x="1380" y="821" class="good">ALLOWED</text>
</svg>
