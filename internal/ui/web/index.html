<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>StateSeal Delivery Intelligence</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true"><span></span></span>
      <span>
        <strong>StateSeal</strong>
        <small>Delivery intelligence</small>
      </span>
    </a>
    <div class="topbar-actions">
      <label class="language-picker">
        <span class="sr-only">Language</span>
        <select id="language" aria-label="Language">
          <option value="en">English</option>
          <option value="zh-CN">简体中文</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="es">Español</option>
          <option value="pt-BR">Português do Brasil</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
        </select>
      </label>
      <span id="connection" class="connection"><i></i> Live</span>
      <button id="refresh" class="icon-button" title="Refresh runs" aria-label="Refresh runs">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg>
      </button>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite">
    <section class="loading-state">
      <span class="loader"></span>
      <p id="loading-copy">Reading local Agent activity…</p>
    </section>
  </main>

  <template id="empty-template">
    <section class="empty-state panel">
      <div class="empty-orbit"><span></span></div>
      <p class="eyebrow" data-i18n="empty.eyebrow">NO SESSIONS OBSERVED</p>
      <h1 data-i18n="empty.title">Agent activity will appear here automatically.</h1>
      <p data-i18n="empty.body">StateSeal reads supported local session logs without hooks, proxies, or changes to Agent execution.</p>
      <code>seal ui</code>
    </section>
  </template>

  <script src="/app.js" defer></script>
</body>
</html>
