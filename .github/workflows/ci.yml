name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/seal
      - name: Validate README source installation
        run: |
          make install INSTALL_DIR="$RUNNER_TEMP/stateseal-bin"
          "$RUNNER_TEMP/stateseal-bin/seal" version --json | grep -q '"version":"v0.1.0-alpha.dev.'
      - name: Validate localization coverage and synchronization
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: sh scripts/check-i18n.sh
      - name: Validate release packaging
        env:
          VERSION: v0.0.0-ci
          TARGETS: linux/amd64
        run: |
          sh -n scripts/build-release.sh scripts/install.sh
          scripts/build-release.sh
          grep -Fq 'STATESEAL_DEFAULT_VERSION:-v0.0.0-ci' dist/install.sh
          sh dist/install.sh --help >/dev/null
          EXPECTED_VERSION=v0.0.0-ci sh scripts/test-install.sh
          tar -xzf dist/stateseal_0.0.0-ci_linux_amd64.tar.gz -C dist
          dist/stateseal_0.0.0-ci_linux_amd64/seal version --json | grep -q '"version":"v0.0.0-ci"'
