name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/seal
      - name: Validate localization coverage and synchronization
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: sh scripts/check-i18n.sh
      - name: Validate release packaging
        env:
          VERSION: v0.0.0-ci
          TARGETS: linux/amd64
        run: |
          sh -n scripts/build-release.sh scripts/install.sh
          scripts/build-release.sh
          tar -xzf dist/stateseal_0.0.0-ci_linux_amd64.tar.gz -C dist
          dist/stateseal_0.0.0-ci_linux_amd64/seal version --json | grep -q '"version":"v0.0.0-ci"'

  sealbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make sealbench
      - run: make stackbench
